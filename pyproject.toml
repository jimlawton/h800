[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h800"
version = "0.10"
description = "Tools (assembler, future simulator) for the Honeywell H-800 / H-1800 mainframe family."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-2.0-only" }
authors = [
  { name = "Jim Lawton", email = "jim.lawton@gmail.com" }
]

keywords = [
  "h800",
  "h1800",
  "assembler",
  "mainframe",
  "retro-computing",
  "apollo",
  "cross-assembler"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Assemblers",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console"
]

# Core runtime dependencies.
dependencies = [
  "py",
  "pyparsing",
  "rapidfuzz",
  "python-Levenshtein",
  "pylog @ git+https://github.com/jimlawton/pylog",
]

[project.scripts]
h800-cli = "h800.cli:main"
h800-disasm = "h800.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "ruff",
  "mypy",
]

[project.urls]
Homepage = "https://github.com/jimlawton/h800"
Repository = "https://github.com/jimlawton/h800"
Issues = "https://github.com/jimlawton/h800/issues"
Documentation = "https://github.com/jimlawton/h800/tree/master/docs"

[tool.setuptools.packages.find]
include = ["h800*"]

[tool.uv]
# You can customize uv behavior here if needed.

[tool.uv.sources]
# Example of declaring a source if you later add a private index.
# pypi = { url = "https://pypi.org/simple" }

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
exclude = [
  "h800.egg-info",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "ERA", "PL", "RUF"]
ignore = [
  "E501",  # Allow long lines in legacy code / docs
]

# Per-file rule suppressions for legacy/testing patterns.
# S101: allow assert statements in tests (pytest idiom)
# PLR0913 / PLR0911 / PLR1714: allow current argument/count complexity in legacy modules
# ERA001: temporarily allow commented-out code fragments in legacy modules (will be cleaned later)
[tool.ruff.lint.per-file-ignores]
"h800/tests/test_*.py" = ["S101"]
"h800/bitfield.py" = ["PLR0911"]
"h800/arguscard.py" = ["PLR0913", "PLR1714"]
"h800/assembler.py" = ["ERA001"]
"h800/cli.py" = ["PLR0912", "PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["h800"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = [
  "h800.egg-info",
  ".venv",
]

[tool.mypy.overrides]
module_glob = "h800.tests.test_*"
disallow_untyped_defs = false
